<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ScreenLens 选股解释器：把自然语言选股意图变成可检查、可修改、可执行的数据条件" />
    <title>ScreenLens 选股解释器</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="padding: 48px 24px; text-align: center; color: #4a5468; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
        正在加载 ScreenLens 选股解释器…
      </div>
    </div>
    <script>
      // 脚本或样式加载失败时给出可操作的提示，而不是留下空白页
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var fb = document.getElementById('boot-fallback');
          if (fb) fb.textContent = '页面资源加载失败，请检查网络后刷新重试。';
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
